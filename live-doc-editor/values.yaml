# Default values for live-doc-editor
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: adrf968/live-doc-editor
  pullPolicy: IfNotPresent
  tag: "9"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: doc-editor.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: doc-editor-tls
  #    hosts:
  #      - doc-editor.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables
env:
  - name: NODE_ENV
    value: "production"
  # Add more environment variables as needed
  # - name: API_URL
  #   value: "https://api.example.com"

# ConfigMap data
configMap:
  enabled: false
  data: {}
    # config.json: |
    #   {
    #     "key": "value"
    #   }

# Secret data (base64 encoded)
secret:
  enabled: false
  data: {}
    # API_KEY: "base64-encoded-value"

# Liveness and Readiness probes
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /ready
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Persistent Volume
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  # existingClaim: ""

# Volume mounts
volumeMounts: []
  # - name: data
  #   mountPath: /app/data

volumes: []
  # - name: data
  #   persistentVolumeClaim:
  #     claimName: data-pvc
